<body>
<title>점메추 너구리</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 휴대폰 한 화면. 위 이름줄 / 가운데 너구리+주문서 쪽지 / 아래 조건 두 줄 / 맨 아래 뽑기 버튼.
   종이 인쇄물 느낌 하나로 가는 디자인이라 밝은 화면만 씁니다. */
:root {
  --paper: #f5f3ec;     /* 바탕 종이 */
  --ink: #2b2a26;       /* 인쇄 글씨 */
  --green: #4c6843;     /* 주문서 초록 인쇄 */
  --line: #c9d2bd;      /* 주문서 칸 줄 */
  --chip: #9aa88c;
  --pen: #1f3a8a;       /* 볼펜 파랑 */
  --red: #c8432b;       /* 도장 */
  --slip: #ffffff;
  --muted: #7a776c;
  --f-print: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-pen: "Gaegu", "Nanum Pen Script", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-print);
  font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 14px;
  display: flex; justify-content: center;
}
.app { width: 100%; max-width: 440px; height: 100%; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
h1 small { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.today { font-size: 12px; color: var(--green); font-variant-numeric: tabular-nums; }

/* 가운데: 너구리 + 쪽지 */
.stage { flex: 1; min-height: 0; position: relative; }
.racc { position: absolute; left: -6px; bottom: 0; height: 60%; width: 60%; display: flex; align-items: flex-end; justify-content: flex-start; pointer-events: none; }
.racc img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; transform-origin: 50% 90%; user-select: none; -webkit-user-drag: none; }
.racc img.bob { animation: bob 2.8s ease-in-out infinite; }
.racc img.shaking { animation: shake .22s linear infinite; }
.racc img.pop { animation: pop .4s cubic-bezier(.3,1.6,.5,1) 1; }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
@keyframes shake { 0% { transform: rotate(-5deg) translateX(-2px) } 50% { transform: rotate(5deg) translateX(2px) } 100% { transform: rotate(-5deg) translateX(-2px) } }
@keyframes pop { 0% { transform: scale(.92) } 100% { transform: scale(1) } }

.side { position: absolute; top: 0; right: 0; width: 58%; min-width: 0; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
.slip { background: var(--slip); border: 1px solid var(--line); padding: 10px 11px 12px; position: relative; }
.slip.in { animation: slipIn .35s ease-out 1; }
@keyframes slipIn { 0% { transform: translateY(8px); opacity: .4 } 100% { transform: none; opacity: 1 } }
.slip-h { display: flex; justify-content: space-between; font-size: 10px; color: var(--green); border-bottom: 1.5px solid var(--green); padding-bottom: 3px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.slip-r { display: grid; grid-template-columns: 1fr 26px; font-size: 10px; color: var(--green); border-bottom: 1px solid var(--line); padding: 3px 0 2px; }
.slip-r span:last-child { text-align: center; border-left: 1px solid var(--line); }
.slip-m { display: grid; grid-template-columns: 1fr 26px; align-items: end; border-bottom: 1px solid var(--line); min-height: 50px; }
.menu { font-family: var(--f-pen); font-weight: 700; color: var(--pen); font-size: clamp(24px, 8vw, 34px); line-height: 1.05; padding: 6px 0 4px; word-break: keep-all; overflow-wrap: anywhere; min-width: 0; }
.menu s { display: block; font-size: .6em; color: var(--muted); text-decoration-thickness: 2px; }
.menu.wait { color: #9aa3c4; }
.qty { font-family: var(--f-pen); font-weight: 700; color: var(--pen); font-size: 22px; text-align: center; border-left: 1px solid var(--line); align-self: stretch; display: grid; place-items: end center; padding-bottom: 4px; }
.tags { font-size: 10.5px; color: var(--muted); padding-top: 5px; min-height: 1.5em; }
.say { font-size: 12.5px; line-height: 1.5; padding-top: 6px; }
.say small { display: block; font-size: 10px; color: var(--green); margin-top: 2px; }
.stamp { position: absolute; right: 36px; top: 34px; width: 44px; height: 44px; border: 2px solid var(--red); border-radius: 50%; color: var(--red); font-size: 12px; font-weight: 700; display: grid; place-items: center; transform: rotate(-14deg); opacity: .85; background: transparent; }
.slip.in .stamp { animation: stamp .3s .25s both; }
@keyframes stamp { 0% { transform: scale(1.8) rotate(-14deg); opacity: 0 } 100% { transform: scale(1) rotate(-14deg); opacity: .85 } }

.acts { position: absolute; right: 0; bottom: 0; width: 44%; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; z-index: 2; }
.links { display: flex; flex-direction: column; align-items: stretch; gap: 6px; font-size: 12.5px; width: 100%; max-width: 168px; }
.link { font: inherit; display: block; text-align: center; background: var(--slip); border: 1px solid var(--line); padding: 6px 10px; color: var(--ink); text-decoration: none; cursor: pointer; line-height: 1.3; }
.link:active { background: var(--paper); }
[hidden] { display: none !important; }
.link.shop { border-color: var(--green); color: var(--green); }
.link.caught { color: var(--red); border-color: var(--red); background: transparent; }
a.link[aria-disabled="true"] { color: var(--muted); border-color: var(--line); pointer-events: none; }
.toast { font-size: 11px; color: var(--green); min-height: 1em; text-align: right; }

/* 아래: 조건 */
.conds { border-top: 1.5px solid var(--green); padding-top: 9px; display: flex; flex-direction: column; gap: 7px; }
.crow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lab { font-size: 11px; color: var(--green); width: 30px; flex: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
.chip { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--chip); padding: 3px 10px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
.morebtn { margin-left: auto; font: inherit; font-size: 12px; background: none; border: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 3px 0; }
.chip:focus-visible, .go:focus-visible, .link:focus-visible, .morebtn:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

.go { font: inherit; font-weight: 700; font-size: 16px; background: var(--ink); color: #fff; border: 0; padding: 13px; cursor: pointer; width: 100%; }
.go:disabled { opacity: .55; cursor: default; }
.disc { font-size: 10px; color: var(--muted); text-align: center; margin-top: -6px; }

/* 더 고르기 창 */
.sheet-bg { position: fixed; inset: 0; background: rgba(43,42,38,.35); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--paper); border-top: 2px solid var(--green);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-in { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; }
.sheet h2 span { font-size: 11px; font-weight: 400; color: var(--muted); }
.sheet .crow { align-items: flex-start; }
.sheet .lab { padding-top: 5px; }
.sheet-act { display: flex; gap: 8px; }
.sheet-act .go { flex: 1 1 0; width: auto; min-width: 0; }
.sheet-act .go.light { background: transparent; color: var(--ink); border: 1px solid var(--ink); font-weight: 500; flex: 0 0 auto; width: auto; padding-inline: 20px; }

.card-view { display: grid; place-items: center; max-height: 44vh; }
.card-view img { max-width: 100%; max-height: 44vh; width: auto; height: auto; border: 1px solid var(--line); background: var(--slip); }
#cardToast { text-align: center; }
@media (prefers-reduced-motion: reduce) {
  .racc img.bob, .racc img.shaking, .racc img.pop, .slip.in, .slip.in .stamp { animation: none; }
}
</style>

<div class="app">
  <header>
    <h1>점메추 너구리</h1>
    <div class="today" id="today"></div>
  </header>

  <section class="stage" aria-live="polite">

  <section class="conds">

</div>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="cardSheet" hidden role="dialog" aria-label="결과 그림 저장">

        <button class="chip" type="button" data-v="아시안" id="c-asia">아시안</button>

/* ---------- 조사 붙이기 ---------- */
function jong(w){ const c=w.charCodeAt(w.length-1); if(c<0xAC00||c>0xD7A3) return -1; return (c-0xAC00)%28; }
function J(w,t){
  const j=jong(w), has=j>0;
  if(t==="은") return w+(has?"은":"는");
  if(t==="이") return w+(has?"이":"가");
  if(t==="을") return w+(has?"을":"를");
  if(t==="으로") return w+(has&&j!==8?"으로":"로");
  if(t==="이야") return w+(has?"이야":"야");
  if(t==="이지") return w+(has?"이지":"지");
  if(t==="이었어") return w+(has?"이었어":"였어");
  return w;
}

const state = { time:null, weather:null, cat:new Set(), spicy:null, mood:null };
const recent = [];

const month = now.getMonth()+1;
const SEASON = month>=3&&month<=5?"봄":month>=6&&month<=8?"여름":month>=9&&month<=11?"가을":"겨울";

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function pool(){
  return items.filter(it=>{
    // 면류는 종류와 함께 고르면 "그 종류이면서 면류"로, 면류만 고르면 모든 면 요리로
    const wantNoodle=state.cat.has("면류"), cuisines=[...state.cat].filter(c=>c!=="면류");
    if(wantNoodle && !it.cats.includes("면류")) return false;
    if(cuisines.length && !it.cats.some(c=>cuisines.includes(c))) return false;
    if(state.spicy==="매움" && !it.tags.includes("매")) return false;
    if(state.spicy==="안매움" && it.tags.includes("매")) return false;
    if(state.mood && !it.tags.includes(state.mood)) return false;
    if(state.time==="점심" && it.tags.includes("술")) return false;
    return true;
  });
}
/* 날씨를 고르면 계절 대신 날씨만 따라요.
   BLOCK: 그 날씨엔 안 나오는 메뉴 (더움: 뜨끈한 것 + 든든한 저녁 고기류 / 추움·비: 시원한 것)
   FAVOR: 그 날씨에 대부분(FAVOR_SHARE = 10번 중 9번) 나오는 메뉴 */
const FAVOR_SHARE = 0.9;
const BLOCK = { 더움: t=>(t.has("따")&&!t.has("시")&&!t.has("여름")) || (t.has("든")&&t.has("저")), 추움: t=>t.has("시"), 비: t=>t.has("시") };
const FAVOR = { 더움: t=>t.has("시")||t.has("간"), 추움: t=>t.has("따"), 비: t=>t.has("비")||t.has("따") };
function allowed(list){
  const f=BLOCK[state.weather]; if(!f) return list;
  const kept=list.filter(it=>!f(new Set(it.tags)));
  return kept.length?kept:list;
}
function choose(list){
  const f=FAVOR[state.weather];
  if(!f) return weightedPick(list);
  const fav=list.filter(it=>f(new Set(it.tags))), rest=list.filter(it=>!f(new Set(it.tags)));
  if(fav.length && (!rest.length || Math.random()<FAVOR_SHARE)) return weightedPick(fav);
  return weightedPick(rest);
}
function weight(it){
  const t=new Set(it.tags); let w=1;
  if(!state.weather || state.weather==="맑음"){
    if(SEASON==="겨울"||SEASON==="가을"){ if(t.has("따")) w*=1.6; if(t.has("시")) w*=(SEASON==="겨울"?.5:.8); }
    if(SEASON==="여름"){ if(t.has("시")) w*=1.8; if(t.has("여름")) w*=2; if(t.has("따")&&!t.has("여름")) w*=.7; }
  }
  if(state.time==="점심"){ if(t.has("저")) w*=.35; if(t.has("혼")||t.has("간")) w*=1.2; }
  if(state.time==="저녁"){ if(t.has("저")) w*=1.6; }
  if(recent.includes(it.name)) w*=.08;
  return w;
}
function weightedPick(list){
  const ws=list.map(weight), sum=ws.reduce((a,b)=>a+b,0);
  let r=Math.random()*sum;
  for(let i=0;i<list.length;i++){ r-=ws[i]; if(r<=0) return list[i]; }
  return list[list.length-1];
}
function lineFor(it){
  const t=new Set(it.tags), opts=[...LINES.common, ...LINES.common];
  if(state.time) opts.push(...LINES[state.time]);
  ["따","시","비","매","혼","든","간","저"].forEach(k=>{
    if(!t.has(k)) return;
    const seasonOn=!state.weather||state.weather==="맑음";
    if(k==="따" && !(state.weather==="추움"||state.weather==="비"||(seasonOn&&(SEASON==="가을"||SEASON==="겨울")))) return;
    if(k==="시" && !(state.weather==="더움"||(seasonOn&&SEASON==="여름"))) return;
    if(k==="비" && state.weather!=="비") return;
    if(k==="저" && state.time!=="저녁") return;
    opts.push(...LINES[k], ...LINES[k]);
  });
  return pick(opts)(it.name);
}

  m.style.fontSize = L<=5 ? "" : L<=7 ? "clamp(20px, 6.2vw, 28px)" : "clamp(17px, 5vw, 23px)";
  $("qty").textContent="1";
  $("stamp").textContent=state.time||"한끼"; $("stamp").hidden=false;
  const labels=[...shown.cats, ...shown.tags.map(k=>TAGNAME[k]).filter(Boolean)];
  $("tags").textContent=labels.join(" · ");
  const shop=$("shop"), link=shopLink(shown.name);
  if(link){ shop.href=link; shop.removeAttribute("aria-disabled"); shop.textContent="해먹을래? 장보러 가기"; }
  else { shop.href="#"; shop.setAttribute("aria-disabled","true"); shop.textContent="장보러 가기 (준비 중)"; }
  $("links").hidden=false; $("toast").textContent="";
  slip.classList.remove("in"); void slip.offsetWidth; slip.classList.add("in");
}

function draw(){
  if(busy) return;
  const list=allowed(pool());
  if(!list.length){
    setPose("idle","pop");
    say("그 조건엔 먹을 게 없네… 조건을 하나만 풀어줘.");
    return;
  }
  busy=true; $("go").disabled=true;
  setPose("shake","shaking");
  const m=$("menu"); m.className="menu wait"; m.textContent="…";
  $("qty").textContent=""; $("stamp").hidden=true; $("tags").textContent=""; $("links").hidden=true; $("toast").textContent="";
  say("달그락 달그락… 뭐가 나올까?");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{
    current=choose(list);
    recent.unshift(current.name); recent.length=Math.min(recent.length,4);
    fake=null;
    const others=list.filter(it=>it.name!==current.name);
    if(others.length && Math.random()<PRANK_CHANCE){
      const fav=others.filter(it=>FAVORITES.includes(it.name));
      fake=pick(fav.length?fav:others);
    }
    nextNo();
    if(fake){ setPose("sly","pop"); say(pick(PRANK)(fake.name)); writeSlip(fake); $("caught").hidden=false; }
    else { setPose("reveal","pop"); say(lineFor(current)); writeSlip(current); $("caught").hidden=true; }
    busy=false; $("go").disabled=false; $("go").textContent="다시 뽑기";
  }, reduce?300:1600);
}

function caught(){
  if(!fake||!current) return;
  setPose("reveal","pop");
  say(pick(CAUGHT)(current.name, fake.name));
  const f=fake; fake=null;
  writeSlip(current, f.name);
  $("caught").hidden=true;
}

async function share(){
  const shown=fake||current; if(!shown) return;
  const text=`먹보 너구리가 오늘 ${state.time||"한 끼"} 메뉴로 ${J(shown.name,"을")} 뽑아줬어요.`;
  const url=location.href.split("#")[0];
  try { if(navigator.share){ await navigator.share({ text, url }); return; } }
  catch(e){ if(e && e.name==="AbortError") return; }
  try { await navigator.clipboard.writeText(text+"\n"+url); $("toast").textContent="결과와 링크를 복사했어요."; }
  catch(e){ $("toast").textContent=text; }
}

/* ---------- 결과 그림 만들기 ---------- */
let ratio="sq", cardBlob=null;
const C = { paper:"#f5f3ec", ink:"#2b2a26", green:"#4c6843", line:"#c9d2bd", pen:"#1f3a8a", red:"#c8432b", slip:"#ffffff", muted:"#7a776c" };
const PRINT='"Noto Sans KR", "Apple SD Gothic Neo", sans-serif', PEN='"Gaegu", "Nanum Pen Script", cursive';
function loadImg(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src; }); }
function wrap(ctx, text, maxW){
  const out=[]; let cur="";
  for(const ch of text){ const n=cur+ch; if(ctx.measureText(n).width>maxW && cur){ out.push(cur); cur=ch.trim()?ch:""; } else cur=n; }
  if(cur) out.push(cur); return out;
}
function fitFont(ctx, text, family, weight, start, maxW){
  let s=start; do { ctx.font=`${weight} ${s}px ${family}`; if(ctx.measureText(text).width<=maxW) break; s-=4; } while(s>30); return s;
}
async function makeCard(){
  try { await Promise.all([document.fonts.load(`700 80px Gaegu`), document.fonts.load(`700 40px "Noto Sans KR"`), document.fonts.load(`400 30px "Noto Sans KR"`)]); } catch(e){}
  const W=1080, H= ratio==="sq"?1080:1920;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const x=cv.getContext("2d");
  x.fillStyle=C.paper; x.fillRect(0,0,W,H);
  const pad=64;
  // 위: 이름과 날짜
  const topY = ratio==="sq"? 96 : 190;
  x.fillStyle=C.ink; x.font=`700 46px ${PRINT}`; x.textBaseline="alphabetic"; x.textAlign="left";
  x.fillText(SITE_NAME, pad, topY);
  x.fillStyle=C.green; x.font=`400 30px ${PRINT}`; x.textAlign="right";
  x.fillText(`${month}.${now.getDate()} ${DAYS[now.getDay()]} · ${SEASON}`, W-pad, topY);
  x.fillStyle=C.green; x.fillRect(pad, topY+26, W-pad*2, 3);
  // 쪽지 위치
  const sw = ratio==="sq"? 560 : 860;
  const sx = ratio==="sq"? W-pad-sw : (W-sw)/2;
  const sy = topY+70;
  // 쪽지 내용 높이 계산
  x.font=`400 34px ${PRINT}`;
  const lines=wrap(x, view.line, sw-80);
  const crossedH = view.crossed? 66:0;
  const sh = 438 + crossedH + lines.length*52;
  // 너구리 (쪽지보다 먼저 그려서 겹치면 쪽지가 위로)
  const img=await loadImg(IMG[view.pose]||IMG.reveal);
  const footY = H-(ratio==="sq"?56:150);
  if(img){
    if(ratio==="sq"){
      const rh=470, rw=rh*img.width/img.height;
      x.drawImage(img, 14, footY-30-rh, rw, rh);
    } else {
      const top=sy+sh+40, rh=Math.min(860, footY-60-top), rw=rh*img.width/img.height;
      x.drawImage(img, (W-rw)/2, top, rw, rh);
    }
  }
  x.fillStyle=C.slip; x.fillRect(sx,sy,sw,sh);
  x.strokeStyle=C.line; x.lineWidth=2; x.strokeRect(sx,sy,sw,sh);
  const ix=sx+40, iw=sw-80; let y=sy+60;
  x.fillStyle=C.green; x.font=`400 28px ${PRINT}`; x.textAlign="left"; x.fillText("주  문  서", ix, y);
  x.textAlign="right"; x.fillText($("slipNo").textContent, ix+iw, y);
  y+=18; x.fillRect(ix,y,iw,3);
  y+=44; x.textAlign="left"; x.fillText("품  명", ix, y); x.textAlign="center"; x.fillText("수량", ix+iw-40, y);
  y+=16; x.fillStyle=C.line; x.fillRect(ix,y,iw,2);
  const qx=ix+iw-80; x.fillRect(qx, y, 2, 150+crossedH);
  // 메뉴 이름
  let my=y;
  if(view.crossed){
    x.fillStyle=C.muted; x.font=`700 54px ${PEN}`; x.textAlign="left";
    my+=58; x.fillText(view.crossed, ix, my);
    const cw=x.measureText(view.crossed).width; x.fillRect(ix, my-18, cw, 4);
  }
  x.fillStyle=C.pen; x.textAlign="left";
  const fs=fitFont(x, view.name, PEN, 700, 118, qx-ix-20);
  my+=130; x.font=`700 ${fs}px ${PEN}`; x.fillText(view.name, ix, my);
  x.font=`700 70px ${PEN}`; x.textAlign="center"; x.fillText("1", qx+40, my);
  y+=150+crossedH; x.fillStyle=C.line; x.fillRect(ix,y,iw,2);
  // 도장
  x.save(); x.translate(qx-90, y-110); x.rotate(-14*Math.PI/180);
  x.globalAlpha=.85; x.strokeStyle=C.red; x.lineWidth=5; x.beginPath(); x.arc(0,0,58,0,Math.PI*2); x.stroke();
  x.fillStyle=C.red; x.font=`700 34px ${PRINT}`; x.textAlign="center"; x.textBaseline="middle"; x.fillText(state.time||"한끼",0,2);
  x.restore(); x.textBaseline="alphabetic";
  // 분류
  y+=46; x.fillStyle=C.muted; x.font=`400 26px ${PRINT}`; x.textAlign="left"; x.fillText((view.tags||[]).join(" · "), ix, y);
  // 한마디
  y+=20; x.fillStyle=C.ink; x.font=`400 34px ${PRINT}`;
  lines.forEach(l=>{ y+=52; x.fillText(l, ix, y); });
  y+=44; x.fillStyle=C.green; x.font=`400 26px ${PRINT}`; x.fillText("먹보 너구리", ix, y);
  // 아래: 이름·주소
  x.fillStyle=C.muted; x.font=`400 28px ${PRINT}`; x.textAlign= ratio==="sq"?"right":"center";
  const foot = SITE_URL? `${SITE_NAME}  ${SITE_URL}` : SITE_NAME;
  x.fillText(foot, ratio==="sq"? W-pad : W/2, footY);
  $("cardImg").src=cv.toDataURL("image/png");
  cardBlob = await new Promise(r=>cv.toBlob(r,"image/png"));
}
async function openCard(o){
  $("cardSheet").hidden=!o; $("sheetBg").hidden=!o;
  if(o){ $("cardToast").textContent="그림 만드는 중…"; await makeCard(); $("cardToast").textContent=""; }
}
async function saveCard(){
  if(!cardBlob) return;
  const fname=`점메추너구리_${view.name}.png`;
  // Claude 아티팩트 안에서는 이 방식으로 저장 (Vercel에서는 그냥 건너뜀)
  if(window.claude && window.claude.use){
    try {
      const dl = await window.claude.use("downloads");
      if(dl){
        try { await dl.save({ filename:fname, data:cardBlob }); $("cardToast").textContent="저장했어요."; }
        catch(e){ if(e && e.code==="declined") return; $("cardToast").textContent="저장이 안 됐어요. 잠시 뒤 다시 눌러 주세요."; }
        return;
      }
    } catch(e){}
  }
  try {
    const file=new File([cardBlob], fname, { type:"image/png" });
    if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return; }
  } catch(e){ if(e && e.name==="AbortError") return; }
  try {
    const a=document.createElement("a"); a.href=URL.createObjectURL(cardBlob); a.download=fname;
    document.body.appendChild(a); a.click(); a.remove();
    $("cardToast").textContent="저장이 안 됐다면 그림을 길게 눌러 저장해 주세요.";
  } catch(e){ $("cardToast").textContent="그림을 길게 눌러 저장해 주세요."; }
}
$("ratio").addEventListener("click",async e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  ratio=b.dataset.r;
  $("ratio").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", String(c===b)));
  await makeCard();
});
$("saveImg").addEventListener("click",()=>openCard(true));
$("cardClose").addEventListener("click",()=>openCard(false));
$("cardSave").addEventListener("click",saveCard);

/* 칩 버튼 */
document.querySelectorAll(".chips[data-group]").forEach(g=>{
  const key=g.dataset.group, mode=g.dataset.mode, req=g.dataset.required;
  g.addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(!b) return;
    const v=b.dataset.v, on=b.getAttribute("aria-pressed")==="true";
    if(mode==="many"){ b.setAttribute("aria-pressed",String(!on)); on?state.cat.delete(v):state.cat.add(v); }
    else {
      if(on && req) return;
      g.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));
      if(!on) b.setAttribute("aria-pressed","true");
      state[key]=on?null:v;
    }
    updateMore();
  });
});
document.querySelectorAll(".chip").forEach(c=>{ if(!c.hasAttribute("aria-pressed")) c.setAttribute("aria-pressed","false"); });

/* 더 고르기 창 */
function updateMore(){
  const n=state.cat.size+(state.spicy?1:0)+(state.mood?1:0);
  $("moreBtn").textContent = n ? `더 고르기 (${n})` : "더 고르기";
}
function openSheet(o){ $("sheet").hidden=!o; $("sheetBg").hidden=!o; if(o) $("sheetClose").focus(); }
$("moreBtn").addEventListener("click",()=>openSheet(true));
$("sheetClose").addEventListener("click",()=>openSheet(false));
$("sheetBg").addEventListener("click",()=>{ openSheet(false); openCard(false); });
$("sheetReset").addEventListener("click",()=>{
  state.cat.clear(); state.spicy=null; state.mood=null;
  $("sheet").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));
  updateMore();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ openSheet(false); openCard(false); } });

/* 너구리가 쪽지 아래 빈 공간에만 서도록 크기 맞추기 */
const stageEl=document.querySelector(".stage"), sideEl=document.querySelector(".side"), raccEl=document.querySelector(".racc");
function fitRaccoon(){
  const H=stageEl.clientHeight, free=H-sideEl.offsetHeight-8;
  raccEl.style.height=Math.max(free, H*0.4)+"px";
}
try { new ResizeObserver(fitRaccoon).observe(sideEl); new ResizeObserver(fitRaccoon).observe(stageEl); } catch(e){ addEventListener("resize",fitRaccoon); }

/* 시작 */
try { if(window.self!==window.top) document.documentElement.classList.add("framed"); } catch(e){ document.documentElement.classList.add("framed"); }
state.time = now.getHours()<15 ? "점심" : "저녁";
$(state.time==="점심"?"t-lunch":"t-dinner").setAttribute("aria-pressed","true");
$("today").textContent = `${month}.${now.getDate()} ${DAYS[now.getDay()]} · ${SEASON}`;
Object.values(IMG).forEach(src=>{ const i=new Image(); i.src=src; });
setPose("idle","bob");
if(COUPANG_COMMON || Object.keys(COUPANG_MENU).length) $("disclosure").hidden=false;

$("go").addEventListener("click",draw);
$("caught").addEventListener("click",caught);
$("share").addEventListener("click",share);
</script>
